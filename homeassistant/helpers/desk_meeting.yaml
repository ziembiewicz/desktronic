# Helpers for cancelling the meeting raise (desk_meeting_reminder, desk_panel_stop, desk_panel_cmd).
# Create them as UI helpers (Settings > Devices & services > Helpers), type Date and/or time, "Date and time",
# with exactly these names: the UI builds the entity ID from the name, and the automations check these IDs.
# UI helpers keep their value across restarts. Create them BEFORE updating the three automations; their
# starting value does not matter (any time more than 60 s ago means "no meeting window").
# The automations compare only the helpers' timestamp attribute, never last_changed.

# input_datetime.desk_meeting_window_at: when the current cancel window opened (an accepted warn, or a go
# without one). The window is open for 60 s; the reminder closes it by writing a time an hour back.
- id: desk_meeting_window_at
  name: Desk meeting window at
  icon: mdi:timer-outline
  has_date: true
  has_time: true

# input_datetime.desk_meeting_cancelled_at: when the panel last cancelled inside an open window (red stop,
# tray menu Cancel, or an accepted move). A cancel counts when it is later than desk_meeting_window_at.
- id: desk_meeting_cancelled_at
  name: Desk meeting cancelled at
  icon: mdi:cancel
  has_date: true
  has_time: true
