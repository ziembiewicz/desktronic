# One nudge = a single tap up, then a single tap down (about 1.5 cm each way; the control box stops
# by itself). Used as a "heads up" before the desk moves on its own.
# Fixed pauses instead of waiting for the desk status: the status sensor updates once a second and can
# miss a move that lasts under a second. 2.5 s covers the measured reaction (up to 0.7 s) plus the move
# (up to 1 s). The ESPHome command scripts run in mode single and drop a command sent while the
# previous one still runs, so the pause must not be shortened.
# Lives under the key desk_nudge in scripts.yaml. Replace biurko_xxxxxx with your desk's entity prefix.
alias: Desk - nudge
mode: single
fields:
  count:
    description: Number of nudges (1-3)
    example: 2
    selector:
      number:
        min: 1
        max: 3
sequence:
- repeat:
    count: '{{ [[count | int(1), 1] | max, 3] | min }}'
    sequence:
    - action: button.press
      target:
        entity_id: button.biurko_xxxxxx_desk_nudge_up
    - delay:
        milliseconds: 2500
    - action: button.press
      target:
        entity_id: button.biurko_xxxxxx_desk_nudge_down
    - delay:
        milliseconds: 2500
