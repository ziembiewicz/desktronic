<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Desk panel for desk-tray.ps1, shown in WebView2. Talks only to the PowerShell host (chrome.webview);
     it never calls Home Assistant. Font: DSEG7 Modern Bold v0.46 (c) keshikan, SIL OFL 1.1, file next to this one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src https://desk.tray">
<style>
@font-face{font-family:"DSEG7";src:url(DSEG7Modern-Bold.woff2) format("woff2");}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#202227;color:#e8eaee;user-select:none;-webkit-user-select:none;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#p{position:relative;height:100%;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
#p.in{animation:slide .18s cubic-bezier(.1,.9,.2,1)}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2px;height:24px}
.hl{display:flex;align-items:center;gap:8px}
/* Status lights under the height: exactly one is lit. green = ready, yellow = moving, a command waits or dry run,
   red = locked, no data from Home Assistant or Home Assistant does not answer. */
.leds{display:flex;gap:10px;margin-top:8px;padding-left:4px}
.leds i{width:10px;height:10px;border-radius:50%;background:#1b1d21;box-shadow:inset 0 0 0 1px #3a3e46}
#lg.on{background:#7dffad;box-shadow:0 0 4px #7dffad,0 0 10px #2fe07a,0 0 22px rgba(47,224,122,.75)}
#ly.on{background:#ffe066;box-shadow:0 0 4px #ffe066,0 0 10px #ffc21a,0 0 22px rgba(255,194,26,.75)}
#lr.on{background:#ff6b6b;box-shadow:0 0 4px #ff6b6b,0 0 10px #ff2e2e,0 0 22px rgba(255,46,46,.75)}
.ttl{font-size:14px;font-weight:600;color:#ffffff}
#st{font-size:13px;color:#b9c0cb}
.ib{width:28px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#a8aeb8;font-size:14px}
.ib:hover{background:rgba(255,255,255,.07)}
#ver{font-size:13px;color:#b9c0cb;padding-right:4px}
#gear{opacity:.35;position:relative}
#gear.upd{opacity:1;color:#ffb020;cursor:pointer}
#gear.upd::after{content:"";position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:#ffb020;box-shadow:0 0 6px #ffb020}
#gear.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.lcd{position:relative;flex-shrink:0;border-radius:8px;background:linear-gradient(180deg,#0b0c0e 0%,#050506 100%);border:1px solid #000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);padding:18px 14px 16px 22px;display:flex;align-items:center;gap:6px;overflow:hidden}
.gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);pointer-events:none}
.hv{display:flex;align-items:baseline;gap:4px;min-width:118px}
#h{font-family:"DSEG7",ui-monospace,monospace;font-size:38px;color:#d9f3ff;letter-spacing:1px;
  text-shadow:0 0 1px rgba(200,235,255,.9),0 0 10px rgba(80,170,255,.35)}
#h.stale{color:#4f5a66;text-shadow:none}
.cm{font-size:12px;color:#7fb4d6}
button{border:0;background:transparent;cursor:pointer;border-radius:8px;touch-action:none;font-family:inherit}
.ar{width:44px;height:52px;color:#ffffff;font-size:20px;flex-shrink:0}
.ar:hover,.go:hover{background:rgba(255,255,255,.06)}
.ar.press,.pb.press,.go.press{background:rgba(47,224,122,.38);color:#c9ffdd;box-shadow:0 0 16px rgba(47,224,122,.55)}
.pb.queued{box-shadow:inset 0 0 0 2px rgba(47,224,122,.8),0 0 14px rgba(47,224,122,.45)}
/* "Ustaw" row: the arrows and the dial only change the number; the desk moves on the go button or Enter. */
.set{position:relative;border-radius:8px;background:linear-gradient(180deg,#0b0c0e 0%,#050506 100%);border:1px solid #000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);padding:8px 12px;display:flex;align-items:center;gap:8px}
.set .lbl{font-size:14px;color:#b9c0cb;width:58px}
#tv{flex:1;min-width:0;height:52px;border:0;outline:0;border-radius:8px;background:#000;text-align:center;padding:0 10px;
  font-family:"DSEG7",ui-monospace,monospace;font-size:30px;color:#d9f3ff;caret-color:#ffc21a;
  text-shadow:0 0 1px rgba(200,235,255,.9),0 0 10px rgba(80,170,255,.35);box-shadow:inset 0 0 0 1px #3a3e46,inset 0 2px 6px rgba(0,0,0,.8)}
#tv::selection{background:transparent}
#tv.stale{color:#4f5a66;text-shadow:none}
#tv.edit{color:#ffe7a3;text-shadow:0 0 1px #ffe7a3,0 0 10px rgba(255,194,26,.45);box-shadow:inset 0 0 0 2px #ffc21a,0 0 14px rgba(255,194,26,.45)}
#tv.bad,.pb.bad{box-shadow:inset 0 0 0 2px #ff5c5c,0 0 14px rgba(255,46,46,.55)}
.go{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#4f5a66;
  box-shadow:inset 0 0 0 1px #2a2e35}
.go.on{color:#7dffad;text-shadow:0 0 6px #2fe07a;box-shadow:inset 0 0 0 2px rgba(47,224,122,.8),0 0 14px rgba(47,224,122,.45)}
.go.queued{color:#7dffad;box-shadow:inset 0 0 0 2px rgba(47,224,122,.8),0 0 14px rgba(47,224,122,.45)}
.sep{width:1px;height:30px;background:rgba(255,255,255,.08);margin:0 4px}
#pr{display:flex;gap:2px;flex:1}
.pb{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.pb:hover{background:rgba(255,255,255,.06)}
.pn{font-size:26px;line-height:1;color:#ffffff}
.pb.on .pn{color:#7dffad;text-shadow:0 0 4px #7dffad,0 0 12px #2fe07a,0 0 26px rgba(47,224,122,.8)}
.pb.on .ph{color:#7dffad;text-shadow:0 0 8px rgba(47,224,122,.7)}
.pb.press .pn{color:#c9ffdd}
.ph{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#a3abb8;letter-spacing:.04em}
#stop{position:relative;z-index:11;width:44px;height:52px;display:flex;align-items:center;justify-content:center}
#stop:hover{background:rgba(255,90,90,.1)}
#stop.press{background:rgba(255,46,46,.4);box-shadow:0 0 18px rgba(255,46,46,.6)}
.ring{position:relative;width:30px;height:30px;border-radius:50%;border:3px solid #ff5c5c;display:block;box-shadow:0 0 6px rgba(255,60,60,.9),0 0 16px rgba(255,46,46,.5),inset 0 0 6px rgba(255,60,60,.5)}
.bar{position:absolute;left:50%;top:50%;width:3px;height:30px;background:#ff5c5c;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 6px rgba(255,60,60,.8)}
/* The bar in place of the "Ustaw" row while the panel cannot move the desk: a big word on a block of colour.
   amber = dry run, red = locked. Its button turns dry run off, or opens the unlock confirmation. */
#bn{display:none;align-items:center;gap:10px;min-height:70px;border-radius:8px;padding:6px 8px 6px 16px}
#bn.dry{background:#ffb020;color:#111}
#bn.lock{background:#e53935;color:#fff}
#bn.bad{box-shadow:0 0 0 3px #fff,0 0 18px rgba(255,255,255,.7)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.1}
#b1{font-size:22px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
#b2{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bb{height:52px;padding:0 18px;font-size:18px;font-weight:700;background:#111;color:#fff;flex-shrink:0}
#bb:hover{background:#000}
#bb.wait{opacity:.55;cursor:default}
/* The unlock confirmation: covers the panel except the stop button (F15 works too). */
#ov{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;justify-content:space-between;
  background:#0c0c0e;padding:14px 76px 14px 16px;border-radius:8px}
#ov .q{font-size:19px;font-weight:700;color:#fff;line-height:1.3}
#ov .row{display:flex;justify-content:space-between;margin-right:-60px}
#ov button{height:52px;padding:0 22px;font-size:18px;font-weight:700;color:#fff}
#ok{background:#e53935}
#ok:disabled{opacity:.35;cursor:default}
#no{background:#3a3e46}
#ov button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body><div id="p">
<div class="hdr"><div class="hl"><div class="ttl">Biurko</div><div id="st">łączenie&hellip;</div></div>
 <div class="hl" style="gap:4px"><div id="ver" title="Wersja panelu"></div><div class="ib" id="gear" title="Ustawienia (jeszcze nie ma)">&#9881;</div><div class="ib" id="hide" title="Ukryj">&#8212;</div></div></div>
<div class="lcd"><div class="gl"></div>
 <div><div class="hv"><div id="h" class="stale">--.-</div><div class="cm">cm</div></div>
  <div class="leds"><i id="lg" title="OK"></i><i id="ly" title="W ruchu albo polecenie czeka"></i><i id="lr" title="Blokada albo brak połączenia z HA"></i></div></div>
 <div class="sep"></div><div id="pr"></div>
 <button id="stop" title="Stop. Pewny stop w trakcie jazdy: pilot"><span class="ring"><span class="bar"></span></span></button>
</div>
<div class="set" id="set"><div class="lbl">Ustaw</div>
 <button class="ar" id="down" title="0,5 cm mniej (biurko stoi)">&#9660;</button>
 <input id="tv" inputmode="decimal" maxlength="6" spellcheck="false" autocomplete="off" title="Wysokość w cm; Enter albo ▶ jedzie, Esc wraca">
 <button class="ar" id="up" title="0,5 cm więcej (biurko stoi)">&#9650;</button>
 <button class="go" id="go" title="Jedź na tę wysokość (Enter)">&#9654;</button></div>
<div id="bn"><div class="bt"><div id="b1"></div><div id="b2"></div></div><button id="bb"></button></div>
<div id="ov"><div class="q">Obejrzałem biurko, na wyświetlaczu pilota nie ma E13 — zdejmij</div>
 <div class="row"><button id="ok">Zdejmij</button><button id="no">Anuluj</button></div></div>
</div>
<script>
"use strict";
const wv = window.chrome && window.chrome.webview;
const send = o => { if (wv) wv.postMessage(o); };
const $ = id => document.getElementById(id);
const STEP = 0.5;         // ▼▲ and the dial change the number by this much; the desk does not move
// No messages: what waits is shown by lit buttons, a lock only by the red dot.
let state = { h: null, status: "", presets: [], locked: false, lock: "", dry: null, api: 0, stale: true, offline: false };
let queue = { goto: 0, preset: 0 };
let editing = false;       // the field holds a typed height; otherwise it follows the desk
// Shown by itself for a meeting and not clicked yet: no focus, keys ignored; the first click makes it a normal panel.
let passive = false;
let swallow = false;       // the click that only woke the meeting panel does not press the bar's button
let pending = null;        // { act } after the bar's button: waits for the state to change, 10 s at most
let pendingTimer = 0;
let failUntil = 0;         // the bar shows "nie zdjęto" / "nie wyłączono" until then
let overlay = false;       // the unlock confirmation is open
let okTimer = 0;
const PENDING_MS = 10000;  // dry_off may wait up to 6 s for a command in flight, then for Home Assistant
const OK_DELAY_MS = 600;   // "Zdejmij" in the confirmation works only after this, so a double click cannot pass it

// The bar, or null. Only on fresh data from an answering Home Assistant. A lock wins over dry run.
// Buttons only when the Home Assistant side knows the commands (api 3) and the helper is exactly "on".
function bar() {
  if (state.stale || state.offline) return null;
  const api3 = (state.api || 0) >= 3;
  if (state.lock === "on" || state.lock === "other") {
    const btn = api3 && state.lock === "on";
    return { cls: "lock", act: "unlock", t1: "ZABLOKOWANY", btn: btn ? "Zdejmij" : "",
             t2: state.lock !== "on" ? "sprawdź HA" : btn ? "panel nie ruszy biurka" : "zdejmij w HA" };
  }
  if (api3 && typeof state.dry === "string" && state.dry !== "off") {
    const btn = state.dry === "on";
    return { cls: "dry", act: "dry_off", t1: "NA SUCHO", btn: btn ? "Wyłącz" : "",
             t2: btn ? "panel nie ruszy biurka" : "sprawdź HA" };
  }
  return null;
}
function startPending(act) {
  pending = { act: act };
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    const b = bar();
    if (pending && b && b.act === pending.act) { failUntil = Date.now() + 3000; setTimeout(paint, 3050); }
    pending = null; paint();
  }, PENDING_MS);
  paint();
}
function openOverlay() {
  overlay = true;
  $("ov").style.display = "flex";
  $("ok").disabled = true;
  clearTimeout(okTimer); okTimer = setTimeout(() => { $("ok").disabled = false; }, OK_DELAY_MS);
  $("no").focus();
}
function closeOverlay() {
  if (!overlay) return;
  overlay = false;
  clearTimeout(okTimer);
  $("ov").style.display = "none";
}

// A press lights the button for at least 180 ms, so even a quick tap is seen.
function flash(el, cls = "press", ms = 180) {
  el.classList.add(cls);
  clearTimeout(el["_t" + cls]); el["_t" + cls] = setTimeout(() => el.classList.remove(cls), ms);
}

function paint() {
  const moving = state.status === "Raising" || state.status === "Lowering";
  const hEl = $("h");
  if (state.stale || state.h === null) { hEl.textContent = "--.-"; hEl.classList.add("stale"); }
  else { hEl.textContent = state.h.toFixed(1); hEl.classList.remove("stale"); }
  // Dry run is never "ready": the yellow light, like the amber bar.
  const light = (state.stale || state.offline || state.locked) ? "lr"
              : (moving || queue.goto || queue.preset || (bar() && bar().cls === "dry")) ? "ly" : "lg";
  for (const id of ["lg", "ly", "lr"]) $(id).classList.toggle("on", id === light);
  const b = bar();
  if (b && editing) editing = false;
  if (pending && (!b || b.act !== pending.act)) { pending = null; clearTimeout(pendingTimer); }
  if (!b || b.act !== "unlock" || !b.btn) closeOverlay();
  $("st").textContent = state.stale ? "brak danych z HA" : b ? (b.cls === "lock" ? "zablokowany" : "na sucho")
                      : moving ? "w ruchu…" : "połączono";
  $("set").style.display = b ? "none" : "";
  const bn = $("bn");
  bn.style.display = b ? "flex" : "none";
  if (b) {
    const failed = Date.now() < failUntil;
    bn.className = b.cls + (failed ? " bad" : "");
    $("b1").textContent = b.t1;
    $("b2").textContent = failed ? (b.act === "unlock" ? "nie zdjęto" : "nie wyłączono") : b.t2;
    const bb = $("bb");
    bb.style.display = b.btn ? "" : "none";
    bb.textContent = pending ? "…" : b.btn;
    bb.classList.toggle("wait", !!pending);
  }
  const pr = $("pr"); pr.innerHTML = "";
  for (const p of state.presets) {
    const b = document.createElement("button"); b.className = "pb"; b.dataset.n = p.n;
    if (!state.stale && !moving && state.h !== null && Math.abs(state.h - p.h) < 0.3) b.classList.add("on");
    if (queue.preset === p.n) b.classList.add("queued");
    b.innerHTML = '<span class="pn">' + p.n + '</span><span class="ph">' + p.h.toFixed(1) + '</span>';
    b.addEventListener("pointerdown", () => flash(b));
    b.addEventListener("click", () => { endEdit(); send({ type: "preset", n: p.n }); });
    pr.appendChild(b);
  }
  const tv = $("tv");
  if (!editing) tv.value = (state.stale || state.h === null) ? "" : state.h.toFixed(1);
  tv.classList.toggle("edit", editing);
  tv.classList.toggle("stale", !editing && state.stale);
  $("go").classList.toggle("on", editing && typed() !== null);
  $("go").classList.toggle("queued", !!queue.goto);
}

// The typed height as a number with one decimal, or null. A comma works as the decimal point.
function typed() {
  const v = $("tv").value.trim();
  if (!/^\d{1,3}(\.\d?)?$/.test(v)) return null;
  return Math.round(parseFloat(v) * 10) / 10;
}
function startEdit() { editing = true; paint(); }
function endEdit() { editing = false; paint(); }
function nudge(d) {
  if (bar()) return;
  const base = editing && typed() !== null ? typed() : state.h;
  if (base === null || base === undefined) return;
  $("tv").value = (Math.round((base + d) * 10) / 10).toFixed(1);
  editing = true; paint();
}
function go() {
  if (bar()) return;
  flash($("go"));
  const h = typed();
  if (!editing || h === null) { if (editing) flash($("tv"), "bad", 600); return; }
  send({ type: "goto", h: h });
  endEdit();
}

if (wv) wv.addEventListener("message", e => {
  const m = e.data;
  if (m.type === "state") {
    state = { h: m.h, status: m.status || "", presets: m.presets || [], locked: !!m.locked, lock: m.lock || "",
              dry: typeof m.dry === "string" ? m.dry : null, api: m.api || 0, stale: !!m.stale, offline: !!m.offline };
    paint();
  } else if (m.type === "queue") {
    queue = { goto: m.goto || 0, preset: m.preset || 0 };
    paint();
  } else if (m.type === "update") {
    // An update on offer: the gear gets an amber dot; a click asks (the question comes from PowerShell).
    const g = $("gear");
    g.classList.toggle("upd", !!m.tag);
    g.classList.toggle("busy", !!m.busy);
    g.title = m.tag ? "Aktualizacja: " + m.tag : "Ustawienia (jeszcze nie ma)";
  } else if (m.type === "version") {
    // The release the starter runs ("v14"; an old "pc-v1.0.2" shows as "v1.0.2"); "manual" outside the starter.
    $("ver").textContent = String(m.v || "").replace(/^pc-/, "");
  } else if (m.type === "refused") {
    // A height out of range or a preset the desk is already at: a short red flash, no text.
    if (m.kind === "goto") flash($("tv"), "bad", 600);
  } else if (m.type === "shown") {
    const p = $("p"); p.classList.remove("in"); void p.offsetWidth; p.classList.add("in");
    passive = !!m.passive;
    if (!passive) $("tv").focus();
  } else if (m.type === "activated") {
    passive = false;
    $("tv").focus();
  } else if (m.type === "hidden") {
    passive = false;
    closeOverlay();
    endEdit();
  }
});

// The first key typed over the live height starts a new number instead of adding to it.
$("tv").addEventListener("beforeinput", e => { if (!editing && e.inputType.startsWith("insert")) $("tv").value = ""; });
// A comma (Polish keyboard) shows as the decimal point right away.
$("tv").addEventListener("input", () => { const t = $("tv"); if (t.value.includes(",")) t.value = t.value.replace(",", "."); startEdit(); });
for (const [id, d] of [["up", STEP], ["down", -STEP]]) {
  $(id).addEventListener("pointerdown", () => flash($(id)));
  $(id).addEventListener("click", () => nudge(d));
}
$("go").addEventListener("click", go);
// The buttons do not take the focus from the field, so typing and Enter keep working after a click.
for (const id of ["up", "down", "go"]) $(id).addEventListener("mousedown", e => e.preventDefault());
$("stop").addEventListener("pointerdown", () => flash($("stop")));
$("stop").addEventListener("click", () => { endEdit(); send({ type: "stop" }); });
$("hide").addEventListener("click", () => send({ type: "hide" }));
$("gear").addEventListener("click", () => { if ($("gear").classList.contains("upd")) send({ type: "update" }); });
// A click anywhere in the meeting panel (before the button under it acts) tells PowerShell to make it active.
// On the bar or the confirmation that first click only wakes the panel: turning dry run off needs a second one.
document.addEventListener("pointerdown", e => {
  swallow = false;
  if (!passive) return;
  passive = false; send({ type: "activate" });
  if (e.target.closest && e.target.closest("#bn, #ov")) { swallow = true; e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener("click", e => { if (swallow) { swallow = false; e.preventDefault(); e.stopPropagation(); } }, true);
$("bb").addEventListener("click", () => {
  const b = bar();
  if (!b || !b.btn || pending) return;
  if (b.act === "dry_off") { send({ type: "dry_off" }); startPending("dry_off"); }
  else openOverlay();
});
$("ok").addEventListener("click", () => {
  if ($("ok").disabled || !overlay) return;
  closeOverlay();
  send({ type: "unlock" });
  startPending("unlock");
});
$("no").addEventListener("click", closeOverlay);
// Keys while the panel is open and active: arrows or F13/F14 change the number (a keyboard dial can send
// these, one key per notch), Enter goes, F15 = stop, Esc drops the typed height, or hides the panel.
const KEYS = { ArrowUp: "up", F13: "up", ArrowDown: "down", F14: "down" };
window.addEventListener("keydown", e => {
  if (passive) { e.preventDefault(); return; }
  if (e.key === "F15") { e.preventDefault(); endEdit(); flash($("stop")); send({ type: "stop" }); return; }
  // The confirmation: Esc cancels; Enter unlocks only from a focused, enabled "Zdejmij", otherwise it cancels.
  if (overlay) {
    if (e.key === "Escape") { e.preventDefault(); closeOverlay(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (!e.repeat && document.activeElement === $("ok") && !$("ok").disabled) $("ok").click(); else closeOverlay();
    }
    return;
  }
  // With the bar shown, no key changes or sends a height.
  if (bar()) { if (e.key === "Escape") send({ type: "hide" }); else if (KEYS[e.key] || e.key === "Enter") e.preventDefault(); return; }
  if (KEYS[e.key]) {
    e.preventDefault();
    flash($(KEYS[e.key]));
    nudge(KEYS[e.key] === "up" ? STEP : -STEP);
  } else if (e.key === "Enter") { e.preventDefault(); if (!e.repeat) go(); }
  else if (e.key === "F15") { e.preventDefault(); endEdit(); flash($("stop")); send({ type: "stop" }); }
  else if (e.key === "Escape") { if (editing) endEdit(); else send({ type: "hide" }); }
});
paint();
send({ type: "ready" });
</script>
</body>
</html>
