<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Desk panel for desk-tray.ps1, shown in WebView2. Talks only to the PowerShell host (chrome.webview);
     it never calls Home Assistant. Font: DSEG7 Modern Bold v0.46 (c) keshikan, SIL OFL 1.1, file next to this one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src https://desk.tray">
<style>
@font-face{font-family:"DSEG7";src:url(DSEG7Modern-Bold.woff2) format("woff2");}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#202227;color:#e8eaee;user-select:none;-webkit-user-select:none;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#p{height:100%;padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px}
#p.in{animation:slide .18s cubic-bezier(.1,.9,.2,1)}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2px;height:24px}
.hl{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#5b6370}
.dot.ok{background:#5fd38a;box-shadow:0 0 6px #5fd38a}
.dot.mv{background:#9ad8ff;box-shadow:0 0 6px #9ad8ff}
.dot.bad{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d}
.ttl{font-size:13px;font-weight:500}
#st{font-size:12px;color:#8a919c}
.ib{width:28px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#a8aeb8;font-size:14px}
.ib:hover{background:rgba(255,255,255,.07)}
#gear{opacity:.35}
.bez{border-radius:12px;padding:5px;background:linear-gradient(180deg,#2a2c30,#141518);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 rgba(0,0,0,.6)}
.lcd{position:relative;border-radius:8px;background:linear-gradient(180deg,#0b0c0e 0%,#050506 100%);border:1px solid #000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);padding:18px 14px 16px 22px;display:flex;align-items:center;gap:6px;overflow:hidden}
.gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);pointer-events:none}
.hv{display:flex;align-items:baseline;gap:4px;min-width:118px}
#h{font-family:"DSEG7",ui-monospace,monospace;font-size:38px;color:#9ad8ff;letter-spacing:1px;
  text-shadow:0 0 6px rgba(120,200,255,.85),0 0 18px rgba(80,170,255,.45)}
#h.stale{color:#4f5a66;text-shadow:none}
.cm{font-size:11px;color:#4f7d9c}
button{border:0;background:transparent;cursor:pointer;border-radius:8px;touch-action:none;font-family:inherit}
.ar{width:48px;height:52px;color:#f2f2f2;font-size:18px}
.ar:hover{background:rgba(255,255,255,.06)} .ar.on{background:rgba(154,216,255,.14);color:#9ad8ff}
.sep{width:1px;height:30px;background:rgba(255,255,255,.08);margin:0 4px}
#pr{display:flex;gap:2px;flex:1}
.pb{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.pb:hover{background:rgba(255,255,255,.06)}
.pn{font-size:24px;line-height:1;color:#f2f2f2}
.pb.on .pn{color:#9ad8ff;text-shadow:0 0 8px rgba(120,200,255,.7)}
.ph{font-family:ui-monospace,Consolas,monospace;font-size:9px;color:#5b6370;letter-spacing:.04em}
#stop{width:44px;height:52px;display:flex;align-items:center;justify-content:center}
#stop:hover{background:rgba(255,90,90,.1)}
.ring{position:relative;width:30px;height:30px;border-radius:50%;border:3px solid #ff4d4d;display:block;box-shadow:0 0 8px rgba(255,77,77,.5)}
.bar{position:absolute;left:50%;top:50%;width:3px;height:30px;background:#ff4d4d;transform:translate(-50%,-50%) rotate(45deg)}
#msg{height:16px;font-size:12px;color:#c9ced6;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.warn{color:#ffb15c} #msg.bad{color:#ff7a7a}
</style>
</head>
<body><div id="p">
<div class="hdr"><div class="hl"><div class="dot" id="dot"></div><div class="ttl">Biurko</div><div id="st">łączenie&hellip;</div></div>
 <div class="hl" style="gap:4px"><div class="ib" id="gear" title="Ustawienia (jeszcze nie ma)">&#9881;</div><div class="ib" id="hide" title="Ukryj">&#8212;</div></div></div>
<div class="bez"><div class="lcd"><div class="gl"></div>
 <div class="hv"><div id="h" class="stale">--.-</div><div class="cm">cm</div></div>
 <div style="display:flex;gap:2px;margin-left:6px">
  <button class="ar" id="up" data-dir="up" title="Stuknij: 3 mm w górę. Przytrzymaj: najbliższy preset wyżej">&#9650;</button>
  <button class="ar" id="down" data-dir="down" title="Stuknij: 3 mm w dół. Przytrzymaj: najbliższy preset niżej">&#9660;</button></div>
 <div class="sep"></div><div id="pr"></div>
 <button id="stop" title="Stop. Pewny stop w trakcie jazdy: pilot"><span class="ring"><span class="bar"></span></span></button>
</div></div>
<div id="msg"></div>
</div>
<script>
"use strict";
const wv = window.chrome && window.chrome.webview;
const send = o => { if (wv) wv.postMessage(o); };
const $ = id => document.getElementById(id);
const HOLD_MS = 600;
const REFUSED = {
  locked: "Zablokowane: biurko nie ruszyło jak trzeba. Sprawdź je i odblokuj w Home Assistant.",
  not_ready: "Biurko jeszcze niegotowe. Spróbuj za chwilę.",
  busy: "Biurko jest zajęte. Spróbuj, gdy stanie.",
  too_soon: "Za szybko. Odczekaj kilka sekund.",
  budget: "Limit ruchów. Odczekaj do 2 minut.",
  motor: "Silnik odpoczywa (limit pracy). Odczekaj kilka minut.",
  reverse: "Zmiana kierunku. Odczekaj 20 s.",
  limit: "Skrajna wysokość.",
  no_preset: "Brak presetu w tę stronę.",
  here: "Biurko już tu jest."
};
let state = { h: null, status: "", presets: [], locked: false, stale: true };
let msgTimer = null;

function showMsg(text, cls, ms) {
  const m = $("msg"); m.textContent = text; m.className = cls || "";
  clearTimeout(msgTimer); if (ms) msgTimer = setTimeout(paint, ms);
}

function paint() {
  const moving = state.status === "Raising" || state.status === "Lowering";
  const hEl = $("h");
  if (state.stale || state.h === null) { hEl.textContent = "--.-"; hEl.classList.add("stale"); }
  else { hEl.textContent = state.h.toFixed(1); hEl.classList.remove("stale"); }
  $("dot").className = "dot " + (state.stale ? "" : state.locked ? "bad" : moving ? "mv" : "ok");
  $("st").textContent = state.stale ? "brak danych z HA" : state.locked ? "zablokowane" : moving ? "w ruchu…" : "połączono";
  const pr = $("pr"); pr.innerHTML = "";
  for (const p of state.presets) {
    const b = document.createElement("button"); b.className = "pb"; b.dataset.n = p.n;
    if (state.h !== null && !state.stale && Math.abs(state.h - p.h) < 0.3) b.classList.add("on");
    b.innerHTML = '<span class="pn">' + p.n + '</span><span class="ph">' + p.h.toFixed(1) + '</span>';
    b.addEventListener("click", () => send({ type: "preset", n: p.n }));
    pr.appendChild(b);
  }
  clearTimeout(msgTimer);
  if (state.locked) showMsg(REFUSED.locked, "bad");
  else if (moving) showMsg("W ruchu. Zatrzymasz pilotem.", "warn");
  else if (state.stale) showMsg("Czekam na dane z Home Assistant.", "");
  else showMsg("", "");
}

if (wv) wv.addEventListener("message", e => {
  const m = e.data;
  if (m.type === "state") {
    state = { h: m.h, status: m.status || "", presets: m.presets || [], locked: !!m.locked, stale: !!m.stale };
    paint();
    if (m.refused && REFUSED[m.refused] && !state.locked) showMsg(REFUSED[m.refused], "warn", 4000);
  } else if (m.type === "shown") {
    const p = $("p"); p.classList.remove("in"); void p.offsetWidth; p.classList.add("in");
  } else if (m.type === "hidden") {
    cancelPress();
  } else if (m.type === "error") {
    showMsg(m.code === "offline" ? "Brak połączenia z Home Assistant." : "Błąd.", "bad", 4000);
  }
});

// Tap = released before HOLD_MS: 3 mm. Hold = still pressed at HOLD_MS: one command to the nearest preset.
// Either way exactly one command per press; nothing repeats while the button is held.
let press = null;
function startPress(btn) {
  cancelPress();
  btn.classList.add("on");
  press = { btn: btn, timer: setTimeout(() => {
    if (!press) return;
    send({ type: "hold", dir: press.btn.dataset.dir });
    press.done = true;
  }, HOLD_MS), done: false };
}
function endPress() {
  if (!press) return;
  clearTimeout(press.timer);
  if (!press.done) send({ type: "tap", dir: press.btn.dataset.dir });
  press.btn.classList.remove("on"); press = null;
}
function cancelPress() {
  if (!press) return;
  clearTimeout(press.timer); press.btn.classList.remove("on"); press = null;
}
for (const id of ["up", "down"]) {
  const b = $(id);
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); startPress(b); });
  b.addEventListener("pointerup", endPress);
  b.addEventListener("pointercancel", cancelPress);
}
window.addEventListener("blur", cancelPress);
$("stop").addEventListener("click", () => { cancelPress(); send({ type: "stop" }); });
$("hide").addEventListener("click", () => send({ type: "hide" }));
paint();
send({ type: "ready" });
</script>
</body>
</html>
